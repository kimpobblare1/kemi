name: Update home snapshot

# 실행 시점:
#  1) 15분마다 자동 (평일 장중 위주로 하고 싶으면 cron 시간을 조정하세요)
#  2) GitHub 저장소 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# index.html을 다시 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 스냅샷 갱신 스크립트 실행
        run: node build-snapshot.js
        # ⚠️ build-snapshot.js와 index.html이 저장소 루트가 아닌 다른 폴더에 있다면
        #    아래처럼 경로를 지정하세요. 예: run: node scripts/build-snapshot.js
        #    (그리고 build-snapshot.js 안의 INDEX_PATH도 그에 맞게 조정)

      - name: 변경사항 커밋 & 푸시
        run: |
          echo ">>> SCRIPT-VERSION-V3-$(date +%s) 시작 <<<"
          set +e

          git config user.name "gemidata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi

          git commit -m "chore: 홈페이지 데이터 스냅샷 자동 갱신"
          echo ">>> 커밋 완료, 푸시 재시도 로직 진입 <<<"

          success=0
          for i in 1 2 3 4 5; do
            echo "===== 푸시 시도 $i/5 ====="
            git push origin HEAD:main 2>&1
            push_result=$?
            echo "===== 푸시 시도 $i/5 결과 코드: $push_result ====="

            if [ $push_result -eq 0 ]; then
              echo "푸시 성공"
              success=1
              break
            fi

            echo "푸시 실패 — 원격 최신본 받아서 rebase 시도"
            git fetch origin main 2>&1
            git rebase origin/main 2>&1
            rebase_result=$?

            if [ $rebase_result -ne 0 ]; then
              echo "rebase 충돌 발생 — 자동 해결 불가, index.html 재생성 방식으로 전환"
              git rebase --abort 2>&1
              git reset --hard origin/main 2>&1
              node build-snapshot.js
              git add index.html
              if git diff --cached --quiet; then
                echo "원격 반영 후 변경사항 없음 — 종료"
                exit 0
              fi
              git commit -m "chore: 홈페이지 데이터 스냅샷 자동 갱신"
            fi

            sleep 3
          done

          if [ $success -ne 1 ]; then
            echo "5회 재시도 후에도 푸시 실패"
            exit 1
          fi

          echo ">>> SCRIPT-VERSION-V3 완료 <<<"
