name: Update home snapshot

# 실행 시점:
#  1) 15분마다 자동 (평일 장중 위주로 하고 싶으면 cron 시간을 조정하세요)
#  2) GitHub 저장소 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# index.html을 다시 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 스냅샷 갱신 스크립트 실행
        run: node build-snapshot.js
        # ⚠️ build-snapshot.js와 index.html이 저장소 루트가 아닌 다른 폴더에 있다면
        #    아래처럼 경로를 지정하세요. 예: run: node scripts/build-snapshot.js
        #    (그리고 build-snapshot.js 안의 INDEX_PATH도 그에 맞게 조정)

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "gemidata-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi

          git commit -m "chore: 홈페이지 데이터 스냅샷 자동 갱신"

          # 15분 주기 스케줄이라 실행이 겹치거나 그 사이 다른 push가 생기면
          # 원격이 로컬보다 앞서 있어 push가 거부될 수 있음(fetch first).
          # 그럴 때는 최신 커밋을 받아 rebase한 뒤 다시 push 시도.
          n=0
          until [ $n -ge 5 ]
          do
            if git push; then
              echo "푸시 성공"
              break
            fi
            n=$((n+1))
            echo "푸시 실패, 재시도 ($n/5) — 원격 변경사항 받아오는 중"
            git pull --rebase origin main
            sleep 3
          done

          if [ $n -ge 5 ]; then
            echo "5회 재시도 후에도 푸시 실패"
            exit 1
          fi
